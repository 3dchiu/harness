<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>突破型 B · 敘事落差｜職缺勝率（三維13分）× 行動骨架</title>
<!--
  端到端樣板 #1：突破型 B（敘事落差）— 已換上真實「職缺勝率」引擎
  流程：intro → input → assess(三維自評) → result(13分/勝率) → scaffold(分流行動) → cta

  ★ 引擎＝填答者自評三維度（產業關係1-4 / 職務重疊1-4 / 條件符合1-5），滿分 13。
     ≤6 勝率低不建議 ｜ 7-9 履歷有效(聚焦放大可達7-8成) ｜ 10-13 條件足夠(沒面試另有原因，注意③=5大材小用)
  ★ Loop B 回補：三維分數存進 W 軸 → 多次後算出「慣性落差」洞察。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{--bg:#F8FBFB;--surface:#FFFFFF;--ink:#1F3533;--ink-soft:#4A6361;--muted:#8AA3A1;
    --line:#E5ECEB;--accent:#2DB3B2;--accent-soft:#E6F7F6;--sand:#FEF6DB;--accent-secondary:#F9D366;}
  html,body{font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 96px;}
  header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;}
  .brand{font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .progress-track{flex:1;max-width:320px;margin-left:24px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:40px 36px;box-shadow:0 4px 20px rgba(39,177,176,.05);}
  .eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;font-weight:700;}
  h1{font-size:28px;line-height:1.35;font-weight:700;margin-bottom:18px;letter-spacing:-.5px;}
  h2{font-size:20px;font-weight:600;margin-bottom:12px;}
  p{margin-bottom:12px;color:var(--ink-soft);} p.lead{font-size:17px;color:var(--ink);}
  .badge{display:inline-block;background:var(--accent);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;letter-spacing:2px;margin-bottom:18px;font-weight:600;}
  label.fld{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:18px 0 6px;}
  textarea,input.txt{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;resize:vertical;}
  textarea:focus,input.txt:focus{border-color:var(--accent);} textarea{min-height:90px;line-height:1.6;}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;}
  .btn{border:none;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s ease;letter-spacing:.5px;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:#239493;transform:translateY(-1px);}
  .btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;transform:none;}
  .btn-secondary{background:transparent;color:var(--muted);padding:14px 0;} .btn-secondary:hover{color:var(--accent);}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}
  /* 維度區塊 */
  .dim{border-top:1px solid var(--line);padding-top:22px;margin-top:24px;}
  .dim .dt{font-size:17px;font-weight:700;color:var(--ink);}
  .dim .ds{font-size:13.5px;color:var(--ink-soft);margin:4px 0 4px;}
  .dim .ask{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;
    padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s ease;font-size:14.5px;color:var(--ink);}
  .opt:hover{border-color:var(--accent);} .opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent);}
  .opt .pt{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);} .opt.sel .pt{color:var(--accent);}
  .opt .eg{display:block;font-size:12px;color:var(--muted);margin-top:3px;}
  /* 勝率儀表 */
  .gauge{display:flex;align-items:center;gap:20px;border-radius:12px;padding:22px 24px;margin:8px 0 18px;}
  .gauge .num{font-size:48px;font-weight:800;line-height:1;} .gauge .meta{font-size:14px;}
  .g-low{background:#F7E9E9;} .g-low .num{color:#B5564F;}
  .g-mid{background:var(--sand);} .g-mid .num{color:#B5891F;}
  .g-high{background:var(--accent-soft);} .g-high .num{color:var(--accent);}
  .bar{display:flex;gap:6px;margin:6px 0 18px;}
  .bar .seg{flex:1;text-align:center;font-size:12px;padding:6px 4px;border-radius:6px;background:var(--line);color:var(--muted);font-weight:600;}
  .bar .seg.on{background:var(--accent);color:#fff;}
  .day{border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:#fff;}
  .day .dnum{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:8px;}
  .day .task{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .day .reflect{font-size:13.5px;color:var(--ink-soft);background:var(--sand);border-radius:8px;padding:8px 12px;margin-top:8px;} .day .reflect b{color:#927218;}
  .box{background:var(--accent-soft);border:1px solid rgba(45,179,178,.2);border-radius:12px;padding:18px 22px;margin:22px 0;font-size:14.5px;color:var(--ink-soft);} .box strong{color:var(--ink);}
  .warn{background:#FBF0DC;border-left:3px solid var(--accent-secondary);padding:14px 18px;border-radius:8px;margin:18px 0;font-size:14px;color:#7a5e12;}
  .step{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
  .step .n{flex-shrink:0;width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-size:13px;font-weight:700;}
  .fade-in{animation:fadeIn .35s ease;} @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:640px){.wrap{padding:24px 12px 64px;}header.top{flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:24px;}
    .progress-track{margin-left:0;max-width:100%;width:100%;}.card{padding:24px 16px;border-radius:12px;}h1{font-size:22px;}
    .gauge .num{font-size:40px;}.actions{flex-direction:column-reverse;gap:12px;}.actions .btn{width:100%;text-align:center;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">生涯設計師 · 突破型 B 樣板</div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  </header>
  <div id="screen" class="card fade-in"></div>
</div>

<script>
/* ===================== 狀態 ===================== */
const state = {
  step:'intro', role:'', past:'',
  dim:{ industry:null, role:null, qual:null }   // 三維自評分數
};
const STEPS={intro:12,input:28,assess:55,result:78,scaffold:92,cta:100};
const screen=document.getElementById('screen');

/* ===================== 引擎：三維 13 分 ===================== */
const DIMS=[
  { key:'industry', title:'① 產業關係', sub:'舊→新產業的跨度（商業模式 B2B/B2C、客戶受眾、產品性質）',
    ask:'兩者賺錢模式相同嗎？面對的客戶相似嗎？',
    options:[
      {v:1,label:'跨度極大：毫無交集',eg:'傳統餐飲店員 → 軟體公司 AI 工程師'},
      {v:2,label:'間接關聯：商業模式或受眾部分重疊',eg:'實體零售店長 → 跨境電商行銷'},
      {v:3,label:'生態上下游：產業鏈不同節點',eg:'筆電代工 PM → 智慧醫療系統 PM'},
      {v:4,label:'相同產業：同市場或直接競品',eg:'蝦皮行銷 → momo 行銷'},
    ]},
  { key:'role', title:'② 職務重疊面積', sub:'日常任務、工具鏈、核心技能的重疊比例',
    ask:'JD 裡有多少 % 是你天天在做的事？要求的工具你熟嗎？',
    options:[
      {v:1,label:'無重疊：核心完全不同',eg:'行政總務 → 網頁前端工程師'},
      {v:2,label:'低重疊：僅部分能力可移轉',eg:'飯店櫃檯 → 業務助理'},
      {v:3,label:'中重疊：任務 40–60% 重合',eg:'線下活動企劃 → 線上產品行銷'},
      {v:4,label:'高重疊：>75% 任務契合',eg:'A公司廣告投放 → B公司數位媒體經理'},
    ]},
  { key:'qual', title:'③ 條件符合程度', sub:'年資、學歷科系、證照、語言等客觀門檻',
    ask:'必備年資我符合嗎？JD 列為 Must-have 的條件，我缺幾項？',
    options:[
      {v:1,label:'完全不符：缺必要年資/證照/技能',eg:'要求5年+英文精通，你無經驗+英文中等'},
      {v:2,label:'低度符合：約 30% 條件',eg:'學歷符合但無關鍵經歷'},
      {v:3,label:'中度符合（推薦投遞）：約 70%、落差微小',eg:'差 1 年資或少一個工具'},
      {v:4,label:'完美對齊：100% 呼應',eg:'年資、技能、專案經歷全中'},
      {v:5,label:'過度符合（警示）：大材小用',eg:'招 1 年初階專員，你已 6 年高階主管'},
    ]},
];
const DNAME={industry:'① 產業關係', role:'② 職務重疊', qual:'③ 條件符合'};
function total(){ const d=state.dim; return d.industry+d.role+d.qual; }
function band(t){ return t<=6?'low':(t<=9?'mid':'high'); }   // 6/7 之間以 ≤6 計為低
function track(){
  const d=state.dim, t=total();
  if(d.qual===5) return 'over';      // 過度符合優先處理
  if(t<=6) return 'low';
  if(d.qual<=2) return 'qualgap';    // 真實條件落差
  if(t>=10) return 'high';           // 條件足夠，問題在別處
  return 'rewrite';                  // 7-9 且①②可補 → 敘事改寫黃金區
}

/* ===================== 渲染 ===================== */
function setProgress(){document.getElementById('progress').style.width=(STEPS[state.step]||0)+'%';}
function render(){
  screen.classList.remove('fade-in');void screen.offsetWidth;screen.classList.add('fade-in');
  setProgress();window.scrollTo({top:0,behavior:'smooth'});
  ({intro:renderIntro,input:renderInput,assess:renderAssess,result:renderResult,scaffold:renderScaffold,cta:renderCTA}[state.step])();
}

function renderIntro(){
  screen.innerHTML=`
    <div class="badge">突破型 · B 敘事落差</div>
    <h1>投履歷前，先算這一封值不值得</h1>
    <p class="lead">你方向沒問題（S 高），卡在「進不去」（W 低）。投之前用三個維度自評勝率，
      把力氣花在<strong>會上的那一封</strong>，而不是海投。</p>
    <div class="box"><strong>三維自評（滿分 13）：</strong>① 產業關係 ② 職務重疊 ③ 條件符合。<br>
      算出勝率後，依結果給你對應的行動——該改寫、該換目標、還是該找人談。</div>
    <div class="actions"><span></span>
      <button class="btn btn-primary" onclick="state.step='input';render()">開始 →</button></div>`;
}
function renderInput(){
  screen.innerHTML=`
    <div class="eyebrow">STEP 1 · 設定目標</div>
    <h2>你要評估哪一個職缺？</h2>
    <label class="fld">🎯 目標職稱</label>
    <input class="txt" id="role" placeholder="例：B2B SaaS 產品經理" value="${state.role}">
    <label class="fld">🧑 你目前/過去的角色（一句話，用來客製後面的行動）</label>
    <input class="txt" id="past" placeholder="例：實體零售店長 5 年" value="${state.past}">
    <p class="hint">全程只在你的瀏覽器計算，不會上傳。</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="state.step='intro';render()">← 返回</button>
      <button class="btn btn-primary" onclick="goAssess()">下一步：三維自評 →</button>
    </div>`;
}
function goAssess(){
  state.role=document.getElementById('role').value.trim();
  state.past=document.getElementById('past').value.trim();
  if(!state.role){ alert('請先填目標職稱'); return; }
  state.step='assess'; render();
}
function renderAssess(){
  const done = state.dim.industry&&state.dim.role&&state.dim.qual;
  screen.innerHTML=`
    <div class="eyebrow">STEP 2 · 投遞前自評</div>
    <h2>對「${state.role}」，你落在哪一格？</h2>
    <p class="hint">每個維度選最貼近你的一項。</p>
    ${DIMS.map(dim=>`
      <div class="dim">
        <div class="dt">${dim.title}</div>
        <div class="ds">${dim.sub}</div>
        <div class="ask">💡 ${dim.ask}</div>
        ${dim.options.map(o=>`
          <div class="opt ${state.dim[dim.key]===o.v?'sel':''}" onclick="setDim('${dim.key}',${o.v})">
            <span class="pt">${o.v} 分</span>${o.label}
            <span class="eg">例：${o.eg}</span>
          </div>`).join('')}
      </div>`).join('')}
    <div class="actions">
      <button class="btn btn-secondary" onclick="state.step='input';render()">← 返回</button>
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="state.step='result';render()">算出勝率 →</button>
    </div>`;
}
function setDim(k,v){ state.dim[k]=v; render(); }

function renderResult(){
  const t=total(), b=band(t), tr=track();
  const gcls={low:'g-low',mid:'g-mid',high:'g-high'}[b];
  const verdict={
    low:'勝率偏低。與其花時間改履歷，不如把力氣放在「換一個更合適的目標」或補上關鍵條件——這一封投下去 CP 值不高。',
    mid:'黃金區。你的條件有效，差在「沒講對」。透過聚焦與放大正確的點，面試機會可拉到七、八成——下面的行動骨架正是為此設計。',
    high:'條件足夠。若投了還沒面試，原因通常不在履歷本身：可能是投遞管道、時機，或——若你 ③ 拿了 5 分——業主擔心你「大材小用」而不敢用。'
  }[b];
  const d=state.dim;
  screen.innerHTML=`
    <div class="eyebrow">STEP 2 · 結果</div>
    <div class="gauge ${gcls}">
      <div class="num">${t}<span style="font-size:20px;font-weight:600;">/13</span></div>
      <div class="meta"><strong>投遞勝率自評</strong><br>對「${state.role}」的整體匹配。</div>
    </div>
    <div class="bar">
      <div class="seg ${b==='low'?'on':''}">≤6 不建議</div>
      <div class="seg ${b==='mid'?'on':''}">7–9 可改寫</div>
      <div class="seg ${b==='high'?'on':''}">10–13 條件足</div>
    </div>
    <p>${verdict}</p>
    <div class="box">
      ① 產業關係 <strong>${d.industry}</strong> ｜ ② 職務重疊 <strong>${d.role}</strong> ｜ ③ 條件符合 <strong>${d.qual}</strong><br>
      <span style="color:var(--muted)">最弱維度：<strong style="color:var(--ink)">${weakestName()}</strong>——這就是這一封最該補的地方。</span>
    </div>
    ${d.qual===5?`<div class="warn">⚠️ ③ 拿 5 分（過度符合）不是好事：業主可能擔心你薪資期待過高、或缺乏挑戰性而快速離職。策略要從「證明我夠強」轉成「證明我為什麼願意留」。</div>`:''}
    <div class="actions">
      <button class="btn btn-secondary" onclick="state.step='assess';render()">← 改自評</button>
      <button class="btn btn-primary" onclick="state.step='scaffold';render()">看我該怎麼做 →</button>
    </div>`;
}
function weakestKey(){
  const d=state.dim;
  // ③=5 視為「過度」非弱；比較 ① ② ③(若<3)
  let arr=[['industry',d.industry],['role',d.role]];
  if(d.qual<=2) arr.push(['qual',d.qual]);
  arr.sort((a,b)=>a[1]-b[1]); return arr[0][0];
}
function weakestName(){ return state.dim.qual===5?'③ 條件（過度符合）':DNAME[weakestKey()]; }

/* ===================== 行動骨架（分流）===================== */
function renderScaffold(){
  const tr=track(), role=state.role, past=state.past||'你過去的角色';
  let html='';
  if(tr==='rewrite') html=rewriteHero(role,past);
  else if(tr==='high') html=highTrack(role,past);
  else if(tr==='qualgap') html=qualgapTrack(role);
  else if(tr==='over') html=overTrack(role);
  else html=lowTrack(role);
  screen.innerHTML=`
    <div class="eyebrow">STEP 3 · 你的行動</div>
    ${html}
    <div class="box"><strong>🔄 Loop B 回補（你最在意的部分）：</strong>
      這次的三維分數會存進你的「市場認知（W 軸）」檔案。投幾個職缺後，App 會算出你的<strong>慣性落差</strong>——<br>
      ・每次都卡 <strong>②職務重疊</strong> → 你一直投離技能太遠的職缺，該「縮小目標」或補一項關鍵技能。<br>
      ・每次都卡 <strong>①產業關係</strong> → 你習慣跨產業跳、敘事成本高，要嘛深耕一個產業、要嘛強化轉譯力。<br>
      ・<strong>③</strong>常拿 5 分 → 你長期低估自己，該往更高階的職缺投。<br>
      單次是勝率，累積起來就是「你該往哪裡去」的市場洞察。</div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="state.step='result';render()">← 回結果</button>
      <button class="btn btn-primary" onclick="state.step='cta';render()">需要有人幫我判斷 →</button>
    </div>`;
}
function rewriteHero(role,past){
  const focus=weakestKey();
  const days = focus==='industry'? industryDays(role,past) : roleDays(role,past);
  const fname = focus==='industry'?'① 產業跨度':'② 職務重疊';
  return `
    <h2>7 天履歷改寫骨架</h2>
    <p>你在黃金區，問題是「沒講對」。骨架聚焦你的最弱維度：<strong>${fname}</strong>。每天 15–20 分鐘。</p>
    ${days.map((x,i)=>`<div class="day"><span class="dnum">Day ${i+1}</span>
      <div class="task">${x.t}</div><div class="reflect">🪞 反思：<b>${x.r}</b></div></div>`).join('')}`;
}
function industryDays(role,past){return[
  {t:`拆解「${role}」所在產業：它的商業模式(B2B/B2C)、客戶是誰、靠什麼賺錢。`,r:`你（${past}）和它，哪一點其實是相通的？`},
  {t:`找出你舊經驗與新產業的 3 個「隱形共通點」（都面對企業客戶？都靠數據決策？）。`,r:`哪個共通點最能讓對方覺得「你懂我們」？`},
  {t:`挑 1 段最強經歷，用「新產業的語言」重寫（把你的黑話翻成它的黑話）。`,r:`這段話，目標產業的人看得懂、有感覺嗎？`},
  {t:`把「跨產業」從劣勢轉成優勢：你帶來什麼產業內人沒有的外部視角？`,r:`你的視角能幫他們解決什麼習以為常的盲點？`},
  {t:`講給 1 個在「目標產業」工作的人聽，記下他覺得不對味的地方。`,r:`他皺眉那句，就是你還沒翻譯成功的地方。`},
  {t:`依回饋改寫履歷摘要，開頭就先點出「為什麼跨產業的我適合這裡」。`,r:`前兩行有沒有先化解「你不是這行的」這個疑慮？`},
  {t:`投遞，並記錄送出日期與回應。`,r:`市場回報（W 驗證度）開始累積——有回應沒回應都是資料。`},
];}
function roleDays(role,past){return[
  {t:`把「${role}」JD 的任務逐條列出，標出你「做過 / 類似做過 / 沒做過」。`,r:`「類似做過」那些，你履歷有寫出來嗎？`},
  {t:`針對每個「類似做過」，寫一個證明你能勝任的具體事例。`,r:`你是不是把可遷移的經驗當成不相關，就沒寫？`},
  {t:`把事例量化（數字、規模、結果），證明能力可遷移。`,r:`哪個數字最能讓人相信「換個場景你也行」？`},
  {t:`用 JD 要求的工具/方法名稱，重寫你的事例（讓關鍵字命中）。`,r:`你熟的工具，有用「它寫的名字」寫出來嗎？`},
  {t:`講給懂這職務的人聽，記下他覺得「這不算數」的地方。`,r:`他打折扣那項，是技能真缺、還是你沒講清楚？`},
  {t:`依回饋改寫履歷技能區與 2 條 bullet，補上可遷移證據。`,r:`陌生人 10 秒內能看出你能做這份工作嗎？`},
  {t:`投遞，並記錄回應。`,r:`沒回應也是資料——可能該縮小目標職務的距離。`},
];}
function highTrack(role,past){return `
  <h2>條件夠了，問題不在履歷</h2>
  <p>你和「${role}」的匹配度足夠。如果投了還沒面試，先別急著改字，檢查這三件：</p>
  <div class="step"><div class="n">1</div><div>投遞<strong>管道與時機</strong>：是否只投人力銀行？試試內推、直接聯絡用人主管。</div></div>
  <div class="step"><div class="n">2</div><div>履歷的<strong>前 5 秒</strong>：摘要有沒有一眼點出你的對口價值（而不是流水帳）。</div></div>
  <div class="step"><div class="n">3</div><div><strong>面試</strong>環節：如果有面試卻沒下文，問題在面試表達，不在履歷。</div></div>
  <div class="warn">想做最後的履歷微調？可參考「敘事改寫」流程，但你的重點應放在通路與面試。</div>`;
}
function qualgapTrack(role){return `
  <h2>這是「條件落差」，不是改寫能補的</h2>
  <p>你對「${role}」的客觀條件還有實質落差（③ 偏低）。誠實說，改履歷用字幫助有限。你有三條路：</p>
  <div class="step"><div class="n">1</div><div><strong>補關鍵門檻</strong>：缺證照/年資 → 先取得最關鍵的那一項，再回來投。</div></div>
  <div class="step"><div class="n">2</div><div><strong>降階切入</strong>：先進門檻較低的相近職位，從內部或一段時間後橫移。</div></div>
  <div class="step"><div class="n">3</div><div><strong>換切入點</strong>：用專案、接案、作品集繞過硬門檻，用成果說話。</div></div>
  <div class="warn">哪一條值得走，是策略判斷——這正是真人諮詢該介入的地方。</div>`;
}
function overTrack(role){return `
  <h2>你可能「太強」了</h2>
  <p>對「${role}」你拿了過度符合（③=5）。高分在這裡是紅燈，策略要從「我夠強」轉成「我為何願意留」：</p>
  <div class="step"><div class="n">1</div><div>履歷<strong>淡化</strong>過高的年資/頭銜，對齊這個職位的實際層級。</div></div>
  <div class="step"><div class="n">2</div><div>求職信主動<strong>回應疑慮</strong>：說明你為何想要這個角色（動機、穩定度）。</div></div>
  <div class="step"><div class="n">3</div><div>或者——<strong>重新考慮</strong>你是否該投更高階的職缺，你可能低估了自己。</div></div>
  <div class="warn">「該降階遷就，還是該往上投」是個重大判斷，建議跟顧問談。</div>`;
}
function lowTrack(role){return `
  <h2>低分是個訊號：先回去盤點你的「專業」</h2>
  <p>勝率偏低，真正的原因往往不是運氣差，而是——<strong>你對自己「專業」的認知，比實際高估了一點</strong>。
     換句話說，你以為的「S 高」，在專業這一塊其實還沒站穩。這不是壞消息，是看清楚的起點。</p>
  <div class="step"><div class="n">1</div><div><strong>回到 S 軸 · 專業梳理任務</strong>：把你的專業拆成「能舉證的硬技能 / 工具 / 成果」清單，每一項都配一個具體事例。</div></div>
  <div class="step"><div class="n">2</div><div>標出哪些<strong>可遷移</strong>、哪些只在原情境成立；再圈出「你以為會、卻舉不出證據」的——那就是要補的。</div></div>
  <div class="step"><div class="n">3</div><div>帶著更誠實的專業盤點，再回來評估職缺（勝率會更準），或先補上最關鍵的一項技能。</div></div>
  <div class="warn">這份盤點會同時回補你的 S 軸檔案——你不只是在找工作，是在把「我到底會什麼」搞清楚。
    （你最弱的維度是 <strong>${weakestName()}</strong>，可從這裡切入。）</div>
  <div style="text-align:center;margin-top:18px;">
    <a href="prototype-s-axis-expertise.html" style="text-decoration:none;">
      <button class="btn btn-primary">開始 S 軸 · 專業梳理任務 →</button></a>
  </div>`;
}

function renderCTA(){
  screen.innerHTML=`
    <div class="eyebrow">下一步 · 當判斷超過工具能力</div>
    <h1 style="font-size:24px;">有些事，分數和模板決定不了</h1>
    <p>「該補能力還是換切入點」「該降階還是往上投」「這條路值不值得繼續」——
       這些是<strong>策略判斷</strong>，需要看你的全局，不是一個分數能回答的。</p>
    <div class="box" style="background:var(--surface);border:1.5px solid var(--line);">
      <strong style="color:var(--accent);font-size:18px;">一對一職涯諮詢</strong>
      <p style="margin:10px 0 0;">帶著你今天的三維評估與行動方向，60 分鐘把「敘事 / 能力 / 切入點」一次釐清，
        走出一份你自己的判斷。</p>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="state.step='scaffold';render()">← 回行動</button>
      <a href="https://lifecareerdesigner.com/consultation-and-courses/#1on1" target="_blank" style="text-decoration:none;">
        <button class="btn btn-primary">預約一對一諮詢 →</button></a>
    </div>`;
}
render();
</script>
