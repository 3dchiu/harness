    <div class="badge">S 軸 · 自我了解</div>
    <h1>自我探索測評中心</h1>
    <p class="lead">四個工具，補齊自我了解四維：<strong>性格 · 興趣 · 價值觀</strong>（＋專業梳理）。每個都「測完不是結束」，而是變成可累積、可行動的資料。</p>
    ${cards.map(c=>`<div class="hubcard" onclick="${c.go}">
      <div class="ic">${c.ic}</div><div class="t"><div class="n">${c.n}</div><div class="d">${c.d}</div></div>
      <div class="st ${d[c.k]?'done':''}">${d[c.k]?'已完成 ✓':'開始'}</div></div>`).join('')}
    <div class="box">💡 完成回補 <strong>S%（自我了解）</strong>；職業價值觀測評的價值觀會流入決策骨架/價值觀排序。</div>`;
}

/* ============ 人格特質測評 ============ */
function discQ(){const done=DISC_Q.every((_,i)=>state.disc.ans[i]);
  const ansN=DISC_Q.filter((_,i)=>state.disc.ans[i]).length;
  screen.innerHTML=`<div class="eyebrow">人格特質測評 · ${ansN}/20</div><h2>請依「像我的程度」評分（1 很不像 → 5 非常像）</h2>
    ${DISC_Q.map((q,i)=>`<div class="q"><div class="qt"><span class="sc">${q.sc}</span>${i+1}. ${q.t}</div>
      <div class="scale">${[1,2,3,4,5].map(v=>`<button class="${state.disc.ans[i]===v?'on':''}" onclick="setDisc(${i},${v})">${v}</button>`).join('')}</div>
      <div class="scalelab"><span>很不像</span><span>非常像</span></div></div>`).join('')}
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="computeDisc()">看結果 →</button></div>`;}
function setDisc(i,v){state.disc.ans[i]=v;render();}
function computeDisc(){const s={D:0,I:0,S:0,C:0};DISC_Q.forEach((q,i)=>s[q.d]+=(state.disc.ans[i]||0));
  state.disc.type=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];state.step='disc_r';render();}
function discR(){const info=DISC_INFO[state.disc.type];const beh=state.disc.beh;
  const cnt=Object.values(beh).filter(v=>v==='y').length;const answered=Object.keys(beh).length;
  screen.innerHTML=`<div class="eyebrow">人格特質測評 · 結果</div>
    <div class="resbox"><div class="rt">${info.n}</div><div class="rd">下面 10 種「這型人常見的行為」，核對哪些是你。</div></div>
    ${info.beh.map((b,i)=>`<div class="item"><span class="nm">${b}</span>
      <div class="seg"><button class="${beh[i]==='y'?'on':''}" onclick="setBeh(${i},'y')">這是我</button>
      <button class="${beh[i]==='n'?'on-n':''}" onclick="setBeh(${i},'n')">這不是我</button></div></div>`).join('')}
    <div class="box">已核對 ${answered}/10，其中「這是我」${cnt} 項。核對一致度越高 → 性格維度越穩定（長期可重測核對）。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='disc_q';render()">← 重測</button>
      <button class="btn btn-primary" onclick="finishTest('disc')">完成，回中心 →</button></div>`;}
function setBeh(i,v){state.disc.beh[i]=v;render();}

/* ============ 興趣方向測評 ============ */
function holQ(){const done=HOL_Q.every((_,i)=>state.hol.ans[i]);
  screen.innerHTML=`<div class="eyebrow">興趣方向測評</div><h2>請依「我喜歡的程度」評分（1 → 5）</h2>
    ${HOL_Q.map((q,i)=>`<div class="q"><div class="qt">${i+1}. ${q.t}</div>
      <div class="scale">${[1,2,3,4,5].map(v=>`<button class="${state.hol.ans[i]===v?'on':''}" onclick="setHol(${i},${v})">${v}</button>`).join('')}</div>
      <div class="scalelab"><span>很不喜歡</span><span>非常喜歡</span></div></div>`).join('')}
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="computeHol()">看結果 →</button></div>`;}
function setHol(i,v){state.hol.ans[i]=v;render();}
function computeHol(){const s={R:0,I:0,A:0,S:0,E:0,C:0};HOL_Q.forEach((q,i)=>s[q.d]+=(state.hol.ans[i]||0));
  state.hol.code=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);state.step='hol_r';render();}
function holProps(){const props=[];state.hol.code.forEach(l=>HOL_PROP[l].forEach(p=>props.push(p)));return props;}
function holR(){const code=state.hol.code;const props=holProps();
  screen.innerHTML=`<div class="eyebrow">興趣方向測評 · 結果</div>
    <div class="resbox"><div class="rt">${code.join(' · ')}</div><div class="rd">你的興趣前三碼：${code.map(l=>HOL_NAME[l]).join('、')}</div></div>
    <p class="hint">針對你的興趣方向，這些提案你的態度是？</p>
    ${props.map((p,i)=>`<div class="item"><span class="nm">${p}</span>
      <div class="seg">
        <button class="${state.hol.prop[i]==='done'?'on':''}" onclick="setProp(${i},'done')">已做過</button>
        <button class="${state.hol.prop[i]==='try'?'on-m':''}" onclick="setProp(${i},'try')">想試試看</button>
        <button class="${state.hol.prop[i]==='no'?'on-n':''}" onclick="setProp(${i},'no')">沒興趣</button>
      </div></div>`).join('')}
    <div class="box">「已做過」「想試試看」的項目，會被帶進<strong>興趣盤點</strong>；「想試試看」也可導入探索A／最小行動。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hol_q';render()">← 重測</button>
      <button class="btn btn-primary" onclick="finishHol()">完成，回中心 →</button></div>`;}
function setProp(i,v){state.hol.prop[i]=v;render();}
function finishHol(){state.intr.seeded=false;finishTest('hol');} /* 重做測評後重新帶入興趣盤點 */

/* ============ 職業價值觀測評（排序）============ */
function startAnc(){state.anc={q:0,picks:[[],[],[],[]],primary:null,secondary:null};state.step='anc_q';render();}
function ancQ(){const qi=state.anc.q;const Q=ANC_Q[qi];const picks=state.anc.picks[qi];const done=picks.length===4;
  screen.innerHTML=`<div class="eyebrow">職業價值觀測評 · 第 ${qi+1}/4 題</div><h2>${Q.q}</h2>
    <p class="hint">依序點選你最認同的前 4 項（第1名4分→第4名1分）。再點一下可取消。</p>
    ${Q.o.map((o,i)=>{const r=picks.indexOf(i);return `<div class="rankopt ${r>=0?'sel':''}" onclick="pickAnc(${i})">
      <div class="rk">${r>=0?r+1:''}</div><div class="ot">${o}</div></div>`;}).join('')}
    <div class="actions"><button class="btn btn-secondary" onclick="${qi===0?"state.step='hub';render()":'prevAnc()'}">← ${qi===0?'回中心':'上一題'}</button>
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="nextAnc()">${qi===3?'看結果 →':'下一題 →'}</button></div>`;}
function pickAnc(i){const picks=state.anc.picks[state.anc.q];const idx=picks.indexOf(i);
  if(idx>=0)picks.splice(idx,1);else if(picks.length<4)picks.push(i);render();}
function prevAnc(){state.anc.q--;render();}
function nextAnc(){if(state.anc.q<3){state.anc.q++;render();}else computeAnc();}
function computeAnc(){const sc={};ANC_TYPES.forEach(t=>sc[t]=0);
  state.anc.picks.forEach(pl=>pl.forEach((optI,rank)=>{sc[ANC_TYPES[optI]]+=(4-rank);}));
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  state.anc.primary=sorted[0][0];state.anc.secondary=sorted[1][0];state.step='anc_r';render();}
function ancR(){const p=state.anc.primary,s=state.anc.secondary;
  screen.innerHTML=`<div class="eyebrow">職業價值觀測評 · 結果</div>
    <div class="resbox"><div class="rd">主要錨定</div><div class="rt">${p}</div>
      <div style="margin:8px 0 14px;">${ANC_VAL[p].map(v=>`<span class="vchip">${v}</span>`).join('')}</div>
      <div class="rd">次要錨定</div><div class="rt" style="font-size:20px;">${s}</div>
      <div style="margin-top:8px;">${ANC_VAL[s].map(v=>`<span class="vchip">${v}</span>`).join('')}</div></div>
    <p>核對一下：你做價值觀排序時，有沒有選到這些？若有，代表內在錨定與顯意識一致。</p>
    <div class="box">把主要＋次要錨定對應的價值觀加入你的清單，之後做價值觀排序或決策骨架會自動帶入。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="startAnc()">← 重測</button>
      <button class="btn btn-primary" onclick="injectAnchor()">加入價值觀清單 → 完成</button></div>`;}
function injectAnchor(){
  const vals=[...new Set([...ANC_VAL[state.anc.primary],...ANC_VAL[state.anc.secondary]])];
  try{const raw=localStorage.getItem('growme_value_items');let arr=raw?JSON.parse(raw):[];if(!Array.isArray(arr))arr=[];
    vals.forEach(v=>{if(!arr.find(o=>(o.name||o)===v))arr.push({name:v,score:5,action:''});});
    localStorage.setItem('growme_value_items',JSON.stringify(arr));}catch(e){}
  finishTest('anc');}

/* ============ 興趣盤點（接興趣方向測評）============ */
function intrS(){
  if(!state.done.hol){
    screen.innerHTML=`<div class="eyebrow">興趣盤點</div><h2>先完成「興趣方向測評」</h2>
      <p class="lead">興趣盤點會把你在興趣方向測評中標為「已做過／想試試看」的項目帶進來，先去完成它吧。</p>
      <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
        <button class="btn btn-primary" onclick="state.step='hol_q';render()">去做興趣方向測評 →</button></div>`;
    return;
  }
  if(!state.intr.seeded){
    const props=holProps();const seeded=[];
    props.forEach((p,i)=>{const a=state.hol.prop[i];if(a==='done'||a==='try')seeded.push({name:p,origin:a,st:null});});
    state.intr.list=seeded;state.intr.seeded=true;
  }
  screen.innerHTML=`<div class="eyebrow">興趣盤點</div><h2>這些興趣，現在是哪種狀態？</h2>
    <p class="hint">已從興趣方向測評帶入。標「持續中／已中斷」，不相關可移除；也可自行新增。</p>
    ${state.intr.list.length?state.intr.list.map((it,i)=>`<div class="item">
      <span class="nm">${it.name}${it.origin?`<span class="otag">${it.origin==='done'?'已做過':'想試試看'}</span>`:''}</span>
      <div class="seg"><button class="${it.st==='on'?'on':''}" onclick="setIntr(${i},'on')">持續中</button>
        <button class="${it.st==='off'?'on-m':''}" onclick="setIntr(${i},'off')">已中斷</button>
        <button onclick="rmIntr(${i})" style="color:var(--muted)">移除</button></div></div>`).join('')
      :`<p class="hint">（測評中沒有標記「已做過/想試試看」的項目，可在下方自行新增。）</p>`}
    <div class="addrow"><input class="txt" id="ni" placeholder="自行新增興趣，例：攝影…"><button class="btn btn-primary btn-sm" onclick="addIntr()">新增</button></div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
      <button class="btn btn-primary" ${state.intr.list.length?'':'disabled'} onclick="finishTest('intr')">完成 →</button></div>`;
}
function setIntr(i,s){state.intr.list[i].st=s;render();}
function rmIntr(i){state.intr.list.splice(i,1);render();}
function addIntr(){const el=document.getElementById('ni');const v=el.value.trim();if(!v)return;state.intr.list.push({name:v,origin:null,st:'on'});render();}
render();
</script>
</body>
</html>
