<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S 軸 · 自我探索測驗中心｜DISC / Holland / Career Anchor</title>
<!--
  端到端樣板 #6：S 軸 · 三項測驗 ＋ 興趣盤點（讓 S 軸四維到齊）
  hub → DISC(性格) / Holland(興趣) / Career Anchor(價值觀) / 興趣盤點
  每項「測完不是結束」：DISC列10行為核對；Holland列提案做過/想試/沒興趣；Anchor注入3價值觀。
  ⚠️ 題目為簡化原創示範版，非官方版權題本。內容邏輯待你校。
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#F8FBFB;--surface:#FFFFFF;--ink:#1F3533;--ink-soft:#4A6361;--muted:#8AA3A1;
    --line:#E5ECEB;--accent:#2DB3B2;--accent-soft:#E6F7F6;--sand:#FEF6DB;--accent-secondary:#F9D366;}
  html,body{font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:740px;margin:0 auto;padding:48px 24px 96px;}
  header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
  .brand{font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .progress-track{flex:1;max-width:300px;margin-left:24px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .4s;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:38px 34px;box-shadow:0 4px 20px rgba(39,177,176,.05);}
  .eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:14px;font-weight:700;}
  h1{font-size:26px;line-height:1.35;font-weight:700;margin-bottom:16px;}
  h2{font-size:20px;font-weight:600;margin-bottom:10px;}
  p{margin-bottom:12px;color:var(--ink-soft);} p.lead{font-size:16px;color:var(--ink);}
  .badge{display:inline-block;background:var(--accent);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;letter-spacing:2px;margin-bottom:16px;font-weight:600;}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;}
  .btn{border:none;padding:13px 26px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:#239493;transform:translateY(-1px);}
  .btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;transform:none;}
  .btn-secondary{background:transparent;color:var(--muted);padding:13px 0;} .btn-secondary:hover{color:var(--accent);}
  .btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
  .hubcard{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:#fff;cursor:pointer;transition:all .15s;}
  .hubcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .hubcard .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .hubcard .t{flex:1;} .hubcard .t .n{font-size:16px;font-weight:700;} .hubcard .t .d{font-size:13px;color:var(--muted);}
  .hubcard .st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--line);color:var(--muted);}
  .hubcard .st.done{background:var(--accent-soft);color:var(--accent);}
  .q{border-bottom:1px solid var(--line);padding:14px 0;}
  .q .qt{font-size:15px;font-weight:600;margin-bottom:10px;}
  .scale{display:flex;gap:6px;} .scale button{flex:1;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted);font-family:inherit;}
  .scale button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .scalelab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
  .resbox{background:var(--accent-soft);border-radius:12px;padding:22px;text-align:center;margin:8px 0 18px;}
  .resbox .rt{font-size:26px;font-weight:800;color:var(--accent);} .resbox .rd{font-size:14px;color:var(--ink-soft);margin-top:6px;}
  .item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;background:#fff;}
  .item .nm{flex:1;font-size:14.5px;}
  .seg{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;}
  .seg button{font-size:12px;padding:6px 10px;border:1.5px solid var(--line);background:#fff;border-radius:13px;cursor:pointer;color:var(--muted);font-weight:600;font-family:inherit;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .seg button.on-y{background:var(--accent);border-color:var(--accent);color:#fff;}
  .seg button.on-n{background:#F4DEDE;border-color:#E9C4C4;color:#9A4A4A;}
  .seg button.on-m{background:var(--accent-secondary);border-color:var(--accent-secondary);color:#5a4a10;}
  .vchip{display:inline-block;background:#fff;border:1.5px solid var(--accent);color:var(--accent);border-radius:14px;padding:5px 14px;margin:4px 6px 0 0;font-weight:600;font-size:14px;}
  .box{background:var(--accent-soft);border:1px solid rgba(45,179,178,.2);border-radius:12px;padding:16px 20px;margin:18px 0;font-size:14px;color:var(--ink-soft);} .box strong{color:var(--ink);}
  .addrow{display:flex;gap:8px;margin-top:10px;}
  input.txt{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;font-size:14.5px;font-family:inherit;outline:none;} input.txt:focus{border-color:var(--accent);}
  .fade-in{animation:fadeIn .35s ease;} @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:640px){.wrap{padding:24px 12px 64px;}header.top{flex-direction:column;align-items:flex-start;gap:12px;}
    .progress-track{margin-left:0;max-width:100%;width:100%;}.card{padding:24px 16px;}h1{font-size:21px;}.actions{flex-direction:column-reverse;gap:10px;}.actions .btn{width:100%;text-align:center;}.item{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">生涯設計師 · 自我探索測驗</div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div></header>
  <div id="screen" class="card fade-in"></div>
</div>
<script>
/* ============ 資料 ============ */
const DISC_Q=[
 {t:'我喜歡主導局面、做決定',d:'D'},{t:'面對挑戰我會直接迎戰',d:'D'},{t:'我重視結果勝過過程',d:'D'},
 {t:'我喜歡認識新朋友、炒熱氣氛',d:'I'},{t:'我擅長用言語影響別人',d:'I'},{t:'我做事憑熱情與直覺',d:'I'},
 {t:'我重視穩定與和諧',d:'S'},{t:'我有耐心、願意傾聽',d:'S'},{t:'我傾向配合團隊而非出風頭',d:'S'},
 {t:'我做事講求精確與規則',d:'C'},{t:'我會先分析資料再行動',d:'C'},{t:'我重視品質與細節',d:'C'}];
const DISC_INFO={
 D:{n:'D 主導型（掌控者）',beh:['開會時常主導方向','遇問題先想怎麼解決','不怕衝突、敢表達反對','做決定快','重視效率與成果','喜歡掌控進度','對拖延沒耐心','願承擔責任與風險','目標導向','對人直接']},
 I:{n:'I 影響型（社交者）',beh:['喜歡與人互動','善於帶動氣氛','用故事或比喻說服人','樂觀有感染力','不喜歡孤立作業','重視被認可','點子多但易分心','表達豐富','交朋友很快','不愛繁瑣細節']},
 S:{n:'S 穩健型（支持者）',beh:['做事穩定可靠','願意傾聽他人','不喜歡突然的改變','重視團隊和諧','願意支持別人','衝突時傾向退讓','忠誠且有耐心','步調平穩','低調不搶功','需要時間適應變動']},
 C:{n:'C 謹慎型（分析者）',beh:['重視正確與精準','行動前先蒐集資料','按規則與標準做事','注意細節','不愛被催促','對品質要求高','獨立作業也自在','決策謹慎','喜歡有條理','對模糊指令不安']}};
const HOL_Q=[
 {t:'我喜歡動手做、操作工具或機械',d:'R'},{t:'我喜歡戶外或實作型的活動',d:'R'},
 {t:'我喜歡研究、分析、解決抽象問題',d:'I'},{t:'我對「為什麼」充滿好奇',d:'I'},
 {t:'我喜歡創作、設計、表達美感',d:'A'},{t:'我喜歡自由、不受框架的工作',d:'A'},
 {t:'我喜歡幫助、教導、陪伴他人',d:'S'},{t:'與人互動讓我有意義感',d:'S'},
 {t:'我喜歡帶領、說服、推動事情成交',d:'E'},{t:'我享受競爭與達成目標',d:'E'},
 {t:'我喜歡有條理地整理資料與流程',d:'C'},{t:'我做事細心、重視規則',d:'C'}];
const HOL_NAME={R:'實作型 R',I:'研究型 I',A:'藝術型 A',S:'社會型 S',E:'企業型 E',C:'事務型 C'};
const HOL_PROP={
 R:['學一項手作技能（木工/維修）','嘗試戶外或運動相關活動','操作一種新工具或設備'],
 I:['鑽研一個你好奇的主題並寫筆記','參加一場知識型講座或課程','做一個小型研究或數據分析'],
 A:['完成一件創作（寫作/設計/影音）','學一種新的藝術形式','參與一個創意專案'],
 S:['擔任志工或帶一次分享','教別人一項你會的技能','參與社群或陪伴型活動'],
 E:['主導一個小專案或提案','嘗試銷售或推廣一樣東西','設定並挑戰一個目標'],
 C:['建立一套整理或記錄系統','協助管理流程或資料','學一個提升效率的工具']};
const ANCHOR_Q=[
 {t:'我希望在專業領域不斷精進、成為專家',a:'技術／職能型'},
 {t:'我希望往上管理、帶人並負成敗責任',a:'管理型'},
 {t:'我希望能自己決定怎麼工作、不被綁',a:'自主／獨立型'},
 {t:'我重視工作與收入的穩定與保障',a:'安全／穩定型'},
 {t:'我想創造屬於自己的東西或事業',a:'創業型'},
 {t:'我希望工作能幫助他人、對世界有貢獻',a:'服務／奉獻型'},
 {t:'我追求克服困難、解決別人解不了的問題',a:'純粹挑戰型'},
 {t:'我希望工作能配合我的生活與家庭',a:'生活型'}];
const ANCHOR_VAL={'技術／職能型':['專業','品質','學習'],'管理型':['領導','影響力','權力'],
 '自主／獨立型':['自由','獨立','彈性'],'安全／穩定型':['穩定','平靜','和平'],
 '創業型':['創新','創造','冒險'],'服務／奉獻型':['利他','助人','意義'],
 '純粹挑戰型':['挑戰','競爭','目標'],'生活型':['平衡','家庭','健康']};

/* ============ 狀態 ============ */
const state={ step:'hub', test:null, disc:{ans:{},type:null,beh:{}}, hol:{ans:{},code:[],prop:{}},
  anc:{ans:{},top:null}, intr:{list:[]}, done:{disc:false,hol:false,anc:false,intr:false} };
const screen=document.getElementById('screen');
function prog(){ const d=state.done; const n=[d.disc,d.hol,d.anc,d.intr].filter(Boolean).length; document.getElementById('progress').style.width=(n/4*100)+'%'; }
function render(){screen.classList.remove('fade-in');void screen.offsetWidth;screen.classList.add('fade-in');prog();window.scrollTo({top:0,behavior:'smooth'});
  const map={hub:renderHub,disc_q:discQ,disc_r:discR,hol_q:holQ,hol_r:holR,anc_q:ancQ,anc_r:ancR,intr:intrS};
  map[state.step]();}
function esc(s){return(s||'').replace(/"/g,'&quot;');}

/* ============ HUB ============ */
function renderHub(){
  const d=state.done;
  const cards=[
   {k:'disc',ic:'🧭',n:'DISC · 性格傾向',d:'測完列 10 種行為核對「這是我/不是我」',start:"state.step='disc_q';render()"},
   {k:'hol',ic:'🎯',n:'Holland · 興趣方向',d:'測完給興趣提案：做過/想試試看/沒興趣',start:"state.step='hol_q';render()"},
   {k:'anc',ic:'⚓',n:'Career Anchor · 職業價值觀',d:'測完把 3 個價值觀加入你的清單',start:"state.step='anc_q';render()"},
   {k:'intr',ic:'🌱',n:'興趣盤點',d:'記錄持續中／曾中斷的興趣',start:"state.step='intr';render()"}];
  screen.innerHTML=`
    <div class="badge">S 軸 · 自我了解</div>
    <h1>自我探索測驗中心</h1>
    <p class="lead">四個小工具，補齊你的自我了解四維：<strong>性格 · 興趣 · 價值觀 · 興趣盤點</strong>。每個都「測完不是結束」，而是變成可累積的資料。</p>
    ${cards.map(c=>`<div class="hubcard" onclick="${c.start}">
      <div class="ic">${c.ic}</div><div class="t"><div class="n">${c.n}</div><div class="d">${c.d}</div></div>
      <div class="st ${d[c.k]?'done':''}">${d[c.k]?'已完成 ✓':'開始'}</div></div>`).join('')}
    <div class="box">💡 完成後資料會回補你的 <strong>S%（自我了解程度）</strong>；Career Anchor 的價值觀會流入決策骨架/價值觀排序。</div>`;
}

/* ============ DISC ============ */
function discQ(){
  const done=DISC_Q.every((_,i)=>state.disc.ans[i]);
  screen.innerHTML=qHTML('DISC · 性格傾向','請依「像我的程度」評分（1 很不像 → 5 非常像）',DISC_Q,state.disc.ans,'setDisc',
    done?"computeDisc()":'', done);
}
function setDisc(i,v){state.disc.ans[i]=v;render();}
function computeDisc(){const s={D:0,I:0,S:0,C:0};DISC_Q.forEach((q,i)=>s[q.d]+=(state.disc.ans[i]||0));
  state.disc.type=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];state.step='disc_r';render();}
function discR(){const info=DISC_INFO[state.disc.type];const beh=state.disc.beh;
  const cnt=Object.values(beh).filter(v=>v==='y').length;const answered=Object.keys(beh).length;
  screen.innerHTML=`
    <div class="eyebrow">DISC · 結果</div>
    <div class="resbox"><div class="rt">${info.n}</div><div class="rd">下面 10 種「這型人常見的行為」，核對哪些是你。</div></div>
    ${info.beh.map((b,i)=>`<div class="item"><span class="nm">${b}</span>
      <div class="seg"><button class="${beh[i]==='y'?'on-y':''}" onclick="setBeh(${i},'y')">這是我</button>
      <button class="${beh[i]==='n'?'on-n':''}" onclick="setBeh(${i},'n')">這不是我</button></div></div>`).join('')}
    <div class="box">已核對 ${answered}/10，其中「這是我」${cnt} 項。核對一致度越高 → 性格維度越穩定（長期可重測核對）。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='disc_q';render()">← 重測</button>
      <button class="btn btn-primary" onclick="finishTest('disc')">完成，回中心 →</button></div>`;
}
function setBeh(i,v){state.disc.beh[i]=v;render();}

/* ============ Holland ============ */
function holQ(){const done=HOL_Q.every((_,i)=>state.hol.ans[i]);
  screen.innerHTML=qHTML('Holland · 興趣方向','請依「我喜歡的程度」評分（1 → 5）',HOL_Q,state.hol.ans,'setHol',done?"computeHol()":'',done);}
function setHol(i,v){state.hol.ans[i]=v;render();}
function computeHol(){const s={R:0,I:0,A:0,S:0,E:0,C:0};HOL_Q.forEach((q,i)=>s[q.d]+=(state.hol.ans[i]||0));
  state.hol.code=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);state.step='hol_r';render();}
function holR(){const code=state.hol.code;const props=[];code.forEach(l=>HOL_PROP[l].forEach(p=>props.push({l,p})));
  screen.innerHTML=`
    <div class="eyebrow">Holland · 結果</div>
    <div class="resbox"><div class="rt">${code.join(' · ')}</div><div class="rd">你的興趣前三碼：${code.map(l=>HOL_NAME[l]).join('、')}</div></div>
    <p class="hint">針對你的興趣方向，這些提案你的態度是？</p>
    ${props.map((o,i)=>`<div class="item"><span class="nm">${o.p}</span>
      <div class="seg">
        <button class="${state.hol.prop[i]==='done'?'on':''}" onclick="setProp(${i},'done')">已做過</button>
        <button class="${state.hol.prop[i]==='try'?'on-m':''}" onclick="setProp(${i},'try')">想試試看</button>
        <button class="${state.hol.prop[i]==='no'?'on-n':''}" onclick="setProp(${i},'no')">沒興趣</button>
      </div></div>`).join('')}
    <div class="box">「想試試看」可導入 <strong>探索A / 最小行動體驗</strong>；「已做過」累積進興趣盤點。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hol_q';render()">← 重測</button>
      <button class="btn btn-primary" onclick="finishTest('hol')">完成，回中心 →</button></div>`;
}
function setProp(i,v){state.hol.prop[i]=v;render();}

/* ============ Career Anchor ============ */
function ancQ(){const done=ANCHOR_Q.every((_,i)=>state.anc.ans[i]);
  screen.innerHTML=qHTML('Career Anchor · 職業價值觀','請依「符合你的程度」評分（1 → 5）',ANCHOR_Q,state.anc.ans,'setAnc',done?"computeAnc()":'',done);}
function setAnc(i,v){state.anc.ans[i]=v;render();}
function computeAnc(){let best=-1,bi=0;ANCHOR_Q.forEach((q,i)=>{if((state.anc.ans[i]||0)>best){best=state.anc.ans[i];bi=i;}});
  state.anc.top=ANCHOR_Q[bi].a;state.step='anc_r';render();}
function ancR(){const a=state.anc.top;const vals=ANCHOR_VAL[a];
  screen.innerHTML=`
    <div class="eyebrow">Career Anchor · 結果</div>
    <div class="resbox"><div class="rt">${a}</div><div class="rd">這個錨對應的 3 個價值觀：</div>
      <div style="margin-top:10px;">${vals.map(v=>`<span class="vchip">${v}</span>`).join('')}</div></div>
    <p>核對一下：你做價值觀排序時，有沒有選到這幾個？若有，代表內在錨定與顯意識一致。</p>
    <div class="box">把這 3 個價值觀加入你的清單，之後做價值觀排序或決策骨架時會自動帶入。</div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='anc_q';render()">← 重測</button>
      <button class="btn btn-primary" onclick="injectAnchor()">加入價值觀清單 → 完成</button></div>`;
}
function injectAnchor(){
  const vals=ANCHOR_VAL[state.anc.top];
  try{ const raw=localStorage.getItem('growme_value_items'); let arr=raw?JSON.parse(raw):[];
    if(!Array.isArray(arr))arr=[];
    vals.forEach(v=>{ if(!arr.find(o=>(o.name||o)===v)) arr.push({name:v,score:5,action:''}); });
    localStorage.setItem('growme_value_items',JSON.stringify(arr));
  }catch(e){}
  finishTest('anc');
}

/* ============ 興趣盤點 ============ */
function intrS(){
  screen.innerHTML=`
    <div class="eyebrow">興趣盤點</div>
    <h2>你的興趣，現在是哪種狀態？</h2>
    <p class="hint">一行一個，標「持續中」或「曾中斷」。中斷的興趣往往藏著線索。</p>
    ${state.intr.list.map((it,i)=>`<div class="item"><span class="nm">${it.name}</span>
      <div class="seg"><button class="${it.st==='on'?'on':''}" onclick="setIntr(${i},'on')">持續中</button>
        <button class="${it.st==='off'?'on-m':''}" onclick="setIntr(${i},'off')">曾中斷</button>
        <button class="" onclick="rmIntr(${i})" style="color:var(--muted)">移除</button></div></div>`).join('')}
    <div class="addrow"><input class="txt" id="ni" placeholder="例：攝影、跑步、寫作…"><button class="btn btn-primary btn-sm" onclick="addIntr()">新增</button></div>
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
      <button class="btn btn-primary" ${state.intr.list.length?'':'disabled'} onclick="finishTest('intr')">完成 →</button></div>`;
}
function addIntr(){const el=document.getElementById('ni');const v=el.value.trim();if(!v)return;state.intr.list.push({name:v,st:'on'});render();}
function setIntr(i,s){state.intr.list[i].st=s;render();}
function rmIntr(i){state.intr.list.splice(i,1);render();}

/* ============ 共用 ============ */
function qHTML(title,sub,arr,ans,setter,nextCall,done){
  return `<div class="eyebrow">${title}</div><h2>${sub}</h2>
    ${arr.map((q,i)=>`<div class="q"><div class="qt">${i+1}. ${q.t}</div>
      <div class="scale">${[1,2,3,4,5].map(v=>`<button class="${ans[i]===v?'on':''}" onclick="${setter}(${i},${v})">${v}</button>`).join('')}</div>
      <div class="scalelab"><span>很不像</span><span>非常像</span></div></div>`).join('')}
    <div class="actions"><button class="btn btn-secondary" onclick="state.step='hub';render()">← 回中心</button>
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="${nextCall||''}">看結果 →</button></div>`;
}
function finishTest(k){state.done[k]=true;state.step='hub';render();}
render();
</script>
</body>
</html>
